name: Create Release

env:
  CI: true

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Enable long paths in Git
      run: git config --system core.longpaths true

    - name: Enable Win32 long paths at runtime
      shell: pwsh
      run: reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f

    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Extract version from version.h
      id: extract_version
      shell: bash
      run: |
        VERSION_FILE="ASI Mod/src/resources/version.h"
        echo "Reading version from $VERSION_FILE"

        VERSION_MAJOR=$(grep '#define VERSION_MAJOR' "$VERSION_FILE" | awk '{print $3}')
        VERSION_MINOR=$(grep '#define VERSION_MINOR' "$VERSION_FILE" | awk '{print $3}')
        VERSION_PATCH=$(grep '#define VERSION_PATCH' "$VERSION_FILE" | awk '{print $3}')

        version="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
        echo "Parsed version: $version"

        echo "version=$version" >> $GITHUB_OUTPUT

    - name: Verify release does not already exist
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $version = "${{ steps.extract_version.outputs.version }}"

        Write-Host "Checking whether release/tag already exists for version $version..."

        $releaseExists = gh release view $version --repo "${{ github.repository }}" 2>$null

        if ($LASTEXITCODE -eq 0) {
          Write-Error "Release posting already exists for version $version. Bump version.h before creating a new release."
          exit 1
        }

        $tagExists = git ls-remote --tags origin "refs/tags/$version"

        if ($tagExists) {
          Write-Error "Git tag already exists for version $version. Bump version.h before creating a new release."
          exit 1
        }

        Write-Host "No existing release or tag found for version $version."

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # -------------------------
    # Prepare output structure
    # -------------------------
    - run: mkdir dist
    - run: mkdir dist/plugins
    - run: mkdir dist/logs
    - run: mkdir dist/assets
    - run: mkdir dist/eu
    - run: mkdir dist/us
    - run: mkdir dist/textures
    
    - run: mkdir dist_2x
    - run: mkdir dist_2x/textures
    
    - run: mkdir dist_4x
    - run: mkdir dist_4x/textures

    # -------------------------
    # Build
    # -------------------------
    - name: Build
      run: msbuild "ASI Mod\${{ github.event.repository.name }}.sln" /m -t:rebuild -verbosity:minimal -property:Configuration=Release -property:Platform=x64  -property:PlatformToolset=v143

    # Copy built binaries directly into plugins/
    - run: Copy-Item "ASI Mod\x64\Release\${{ github.event.repository.name }}.asi" "dist/plugins/${{ github.event.repository.name }}.asi"

    # Logs & metadata
    - run: Copy-Item README.md "dist/logs/${{ github.event.repository.name }}_Game.log"
    - run: Copy-Item README.md "dist/logs/${{ github.event.repository.name }}_Launcher.log"
    - run: Copy-Item README.md "dist/logs/${{ github.event.repository.name }}_README.md"
    - run: Copy-Item LICENSE "dist/plugins/${{ github.event.repository.name }}_LICENSE"
    - run: Copy-Item "ASI Mod\${{ github.event.repository.name }}.ini" "dist/plugins/${{ github.event.repository.name }}.ini"
    

    # Build Dist Folders
    - name: Build Dist Folders
      run: |
        $RepoRootDir = "${{ github.workspace }}"
        $scriptPath  = Join-Path $RepoRootDir "Build_Dist_Folders.py"

        if (-not (Test-Path $scriptPath)) {
          Write-Error "Build_Dist_Folders.py not found at $scriptPath"
          exit 1
        }

        Write-Host "Running Build_Dist_Folders.py..."
        py $scriptPath


    # Package everything
    - name: Create Base release zip
      working-directory: dist
      run: 7z a -tzip "../${{ github.event.repository.name }}_Base_v${{ steps.extract_version.outputs.version }}.zip" *

    - name: Create 2x Upscaled release zip
      working-directory: dist_2x
      run: 7z a -tzip "../${{ github.event.repository.name }}_2x_Upscaled_Addon_v${{ steps.extract_version.outputs.version }}.zip" *

    - name: Create 4x Upscaled release zip
      working-directory: dist_4x
      run: 7z a -tzip "../${{ github.event.repository.name }}_4x_Upscaled_Addon_v${{ steps.extract_version.outputs.version }}.zip" * -v2000m

    - name: Create 4x Upscaled Nexus release zip
      working-directory: dist_4x
      run: 7z a -tzip "../${{ github.event.repository.name }}_4x_Upscaled_Nexus.zip" *

    - name: Upload to NexusMods - Base
      uses: Nexus-Mods/upload-action@v1.0.0-beta.9
      with:
        api_key: ${{ secrets.NEXUSMODS_API_KEY }}
        file_id: 498874
        display_name: "${{ github.event.repository.name }} - Base"
        filename: ${{ github.event.repository.name }}_Base_v${{ steps.extract_version.outputs.version }}.zip
        version: "${{ steps.extract_version.outputs.version }}"
        category: main
        archive_existing_version: true
        primary_mod_manager_download: true
        description: |
          Extract the contents of the zip into your game folder.
          (e.g., steamappscommonMGS2)

    - name: Upload to NexusMods - 2x Upscaled Addon
      uses: Nexus-Mods/upload-action@v1.0.0-beta.9
      with:
        api_key: ${{ secrets.NEXUSMODS_API_KEY }}
        file_id: 498883
        display_name: "${{ github.event.repository.name }} - 2x Upscaled Addon"
        filename: ${{ github.event.repository.name }}_2x_Upscaled_Addon_v${{ steps.extract_version.outputs.version }}.zip
        version: "${{ steps.extract_version.outputs.version }}"
        category: optional
        archive_existing_version: true
        description: |
          2x AI upscaled texture addon, upscaling -everything- except UI. 5.4 GB Extracted

          The base version must be installed first!

          As we fix/replace nearly all of the game's textures, our upscaled text packs do FULLY REPLACE LiqMix's AI Slop texture packs.

    - name: Upload to NexusMods - 4x Upscaled Addon
      uses: Nexus-Mods/upload-action@v1.0.0-beta.9
      with:
        api_key: ${{ secrets.NEXUSMODS_API_KEY }}
        file_id: 498877
        display_name: "${{ github.event.repository.name }} - 4x Upscaled Addon"
        filename: ${{ github.event.repository.name }}_4x_Upscaled_Nexus.zip
        version: "${{ steps.extract_version.outputs.version }}"
        category: optional
        archive_existing_version: true
        update_mod_version: true
        description: |
          4x AI upscaled texture addon, upscaling -everything- except UI. 23.12GB Extracted

          The base version must be installed first!

          As we fix/replace nearly all of the game's textures, our upscaled text packs do FULLY REPLACE LiqMix's AI Slop texture pack.

    - name: Generate Release Posting
      uses: ncipollo/release-action@v1
      with:
        artifacts: >
          ${{ github.event.repository.name }}_Base_v${{ steps.extract_version.outputs.version }}.zip,
          ${{ github.event.repository.name }}_2x_Upscaled_Addon_v${{ steps.extract_version.outputs.version }}.zip,
          ${{ github.event.repository.name }}_4x_Upscaled_Addon_v${{ steps.extract_version.outputs.version }}.zip*
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ steps.extract_version.outputs.version }}
        name: "${{ steps.extract_version.outputs.version }}"
        draft: true
        generateReleaseNotes: true
        artifactErrorsFailBuild: true
